name: Deploy to Cloudflare Workers

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mjs'
      - 'test/**'
      - '.github/workflows/deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mjs'
      - 'test/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Worker and validate deployment bundle
        run: npm run check

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: 'deploy --env=""'
