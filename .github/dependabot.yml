version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: 08:00
    timezone: Asia/Shanghai
  open-pull-requests-limit: 20
  groups:
    dependencies:
      patterns:
      - '*'
  commit-message:
    prefix: chore(deps)
- package-ecosystem: npm
  directory: /
  ignore:
  - dependency-name: undici
    update-types:
    - version-update:semver-major
  schedule:
    interval: daily
    time: 08:00
    timezone: Asia/Shanghai
  open-pull-requests-limit: 20
  groups:
    dependencies:
      patterns:
      - '*'
  commit-message:
    prefix: chore(deps)
